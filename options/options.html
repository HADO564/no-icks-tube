<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>no-icks-tube — Fix your icks</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="head">
        <h1>no-icks-tube</h1>
        <p class="tagline">Tick off the YouTube icks you want gone.</p>
        <div class="toolbar">
          <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 Search icks…"
            autocomplete="off"
            aria-label="Search icks"
          />
          <span class="summary" id="summary"></span>
        </div>
      </header>

      <!-- Icks, grouped into collapsible sections by area. Built by
           options.js from the registry (src/icks.js). -->
      <div id="groups"></div>

      <p class="empty" id="noMatches" hidden>No icks match your search.</p>

      <p class="error" id="rangeError" hidden>
        Minimum can't be higher than the maximum.
      </p>

      <footer class="foot">
        <p class="foot-hint">
          Got an ick we don't fix yet? Suggest it, or upvote one others have
          already raised.
        </p>
        <div class="foot-buttons">
          <a id="submitIck" class="btn primary" target="_blank" rel="noopener">
            🤢 Suggest an ick
          </a>
          <a id="browseIcks" class="btn" target="_blank" rel="noopener">
            🗳️ Browse &amp; upvote icks
          </a>
        </div>
      </footer>

      <p class="saved" id="savedNote" hidden>Saved ✓</p>
    </main>

    <script src="../src/icks.js"></script>
    <script src="options.js"></script>
  </body>
</html>
